<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Như Minh ✨</title>
    <!-- Font chữ lãng mạn cho thư và hiện đại cho đồng hồ -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <!-- Thư viện hiệu ứng pháo hoa canvas-confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f3f4f6;
            --accent-color: #ff758c;
            --accent-glow: #ff758c88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #1e1b4b 0%, #090514 100%);
        }

        /* Vùng Đếm Ngược */
        #countdown-container {
            text-align: center;
            transition: opacity 1s ease, transform 1s ease;
            z-index: 10;
            padding: 20px;
        }

        #countdown-container h2 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            color: #e0e7ff;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .timer {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 90px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .time-box span {
            display: block;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--accent-color);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .time-box .label {
            font-size: 0.8rem;
            color: #9ca3af;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* Vùng Nội Dung Bất Ngờ (Thư) */
        #birthday-container {
            display: none;
            opacity: 0;
            max-width: 600px;
            width: 90%;
            margin: 20px auto;
            transition: opacity 2s ease;
            z-index: 10;
        }

        .letter-box {
            background: linear-gradient(135deg, rgba(20, 16, 35, 0.85) 0%, rgba(10, 7, 18, 0.95) 100%);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 117, 140, 0.2);
            box-shadow: 0 0 40px rgba(255, 117, 140, 0.15);
            backdrop-filter: blur(12px);
            position: relative;
        }

        .letter-box::before {
            content: '🎂';
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px var(--accent-color));
        }

        .letter-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #f1f5f9;
            text-align: justify;
            white-space: pre-line;
        }

        /* Chữ chạy hiệu ứng tự gõ */
        .typed-text::after {
            content: '|';
            animation: blink 0.7s infinite;
            color: var(--accent-color);
        }
        
        .typed-text.done::after {
            display: none;
        }

        .signature-block {
            margin-top: 2.5rem;
            text-align: right;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--accent-color);
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .signature-block p {
            margin-bottom: 0.2rem;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Responsive di động */
        @media (max-width: 480px) {
            .timer { gap: 0.7rem; }
            .time-box { padding: 1rem; min-width: 70px; }
            .time-box span { font-size: 1.8rem; }
            .letter-box { padding: 1.5rem; }
            .letter-content { font-size: 1rem; line-height: 1.6; }
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐẾM NGƯỢC -->
    <div id="countdown-container">
        <h2>ĐANG ĐẾM NGƯỢC ĐẾN KHOẢNH KHẮC ĐẶC BIỆT...</h2>
        <div class="timer">
            <div class="time-box"><span id="days">00</span><div class="label">Ngày</div></div>
            <div class="time-box"><span id="hours">00</span><div class="label">Giờ</div></div>
            <div class="time-box"><span id="minutes">00</span><div class="label">Phút</div></div>
            <div class="time-box"><span id="seconds">00</span><div class="label">Giây</div></div>
        </div>
    </div>

    <!-- MÀN HÌNH QUÀ TẶNG (THƯ & PHÁO HOA) -->
    <div id="birthday-container">
        <div class="letter-box">
            <div class="letter-content" id="letter">
                <span id="text-target" class="typed-text"></span>
            </div>
            <div class="signature-block" id="signature">
                <p>Pro Noodle</p>
                <p style="font-size: 1.4rem; font-family: 'Quicksand', sans-serif; font-weight:600; color:#9ca3af;">Duy (đtrai)</p>
            </div>
        </div>
    </div>

    <script>
        // Cài đặt mốc thời gian đích chính xác là 00h00 ngày 15/6/2026
        const targetDate = new Date("2026-06-15T00:00:00").getTime();

        // Nội dung bức thư giữ nguyên gốc từ ảnh 2aOboQdWpN1tooQB5CGGvSsXzoQcyQxv5OMM7B3o.jpg
        const letterText = `Chảo sang hảo xin chào Như Minh, anh là Quang Duy đây, đã bước sang tuổi mới rồi, em có điều ước gì chưa ? nếu chưa thì ước ngay đi, còn nếu rồi thì anh ước tiếp cho nhé. Monh cho em có một tuổi mới hạnh phúc hơn, vui vẻ hơn đạt được nhiều thành công hơn. Tuổi vừa qua em đã cố gắng nhiều rồi, mong năm nay em vẫn cố gắng như thế nhưng thành công sẽ cộng 1 nhân 8 thêm mũ 3 rồi giai thừa 6 nhé. Nhưng quan trọng nhất mà anh vẫn luôn mong mỗi tuổi mới của em là sức khoẻ phải thật dồi dào sinh lực như người nhện, tuổi mới phải hạn chế thức khuya đi. Cuối cùng anh mong những điều tốt đẹp nhất sẽ luôn đến mới em vì em luôn xứng đáng có tất cả điều đó. Còn anh (món quà vô giá đẳng cấp top 1 kị sĩ thượng tướng siêu nhân của em) sẽ luôn bên cạnh hỗ trợ để tạo ra thêm nhiều hạnh phúc của em.`;

        const countdownContainer = document.getElementById('countdown-container');
        const birthdayContainer = document.getElementById('birthday-container');
        const textTarget = document.getElementById('text-target');
        const signature = document.getElementById('signature');

        const interval = setInterval(() => {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                clearInterval(interval);
                triggerBirthdaySurprise();
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }, 1000);

        function triggerBirthdaySurprise() {
            // Ẩn màn hình đếm ngược
            countdownContainer.style.opacity = '0';
            countdownContainer.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                countdownContainer.style.display = 'none';
                
                // Hiện khung thư công chúa
                birthdayContainer.style.display = 'block';
                setTimeout(() => {
                    birthdayContainer.style.opacity = '1';
                    startTypingEffect();
                    startFireworkShow();
                }, 100);
            }, 1000);
        }

        // Hiệu ứng chữ chạy từng ký tự
        function startTypingEffect() {
            let index = 0;
            function type() {
                if (index < letterText.length) {
                    textTarget.innerHTML += letterText.charAt(index);
                    index++;
                    setTimeout(type, 35); // Tốc độ gõ chữ
                } else {
                    textTarget.classList.add('done');
                    signature.style.opacity = '1';
                }
            }
            type();
        }

        // Hiệu ứng bắn pháo hoa từ thư viện canvas-confetti
        function startFireworkShow() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });

            const duration = 15 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const intervalFireworks = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(intervalFireworks);
                }

                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
