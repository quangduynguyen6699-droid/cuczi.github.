<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời Mời Sinh Nhật Đặc Biệt</title>
    <style>
        :root {
            --primary-color: #ff9a9e;
            --secondary-color: #fad0c4;
            --text-color: #4a4a4a;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Khung bao ngoài thiệp */
        .birthday-card {
            position: relative;
            width: 360px;
            height: 480px;
            cursor: pointer;
            transform-style: preserve-3d;
            transform: perspective(2500px);
            transition: 1.5s;
        }

        /* Khi mở thiệp, hơi xoay nhẹ cả cụm thiệp để tạo góc nhìn 3D đẹp mắt */
        .birthday-card.open {
            transform: perspective(2500px) rotateY(15deg);
        }

        /* Tạo cụm nắp thiệp */
        .cover {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-origin: left;
            transform-style: preserve-3d;
            transition: 1.5s;
            z-index: 2;
        }

        .birthday-card.open .cover {
            transform: rotateY(-160deg);
        }

        /* Định dạng chung cho các mặt của nắp thiệp */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            border: 5px solid #fff;
        }

        /* Mặt trước của thiệp */
        .front {
            background-color: #fff;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            box-shadow: 10px 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .front h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .front .heart-icon {
            font-size: 3.5rem;
            color: #ff4d6d;
            margin-bottom: 25px;
            animation: beat 1.2s infinite;
        }

        .front .click-me {
            background: #ff4d6d;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        /* Mặt sau của nắp thiệp */
        .back {
            background-color: #fff5f5;
            transform: rotateY(180deg);
            padding: 20px;
            text-align: center;
        }
        
        .back-pattern {
            width: 85%;
            height: 85%;
            border: 2px dashed #ffb3c1;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff758f;
            font-size: 3.5rem;
        }

        /* Nội dung bên trong thiệp */
        .inside {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            border-radius: 10px;
            z-index: 1;
            padding: 35px 25px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Căn đều bố cục từ trên xuống dưới */
            box-shadow: 10px 10px 20px rgba(0,0,0,0.1);
            border: 5px solid #fff;
        }

        .inside h2 {
            color: #ff4d6d;
            margin: 0 0 10px 0;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        .poem {
            color: var(--text-color);
            font-style: italic;
            line-height: 1.5;
            font-size: 1.05rem;
            margin: 0;
            padding: 0 10px;
        }

        .info {
            padding: 15px;
            background-color: #fff0f3;
            border-radius: 10px;
            font-weight: bold;
            color: #e63946;
            line-height: 1.8;
            font-size: 1.05rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
            text-align: left; /* Để thông tin thời gian địa điểm ngay hàng thẳng lối */
            margin: 10px 0;
        }

        .inside .closing {
            margin: 0;
            font-weight: 500;
            color: #ff4d6d;
            font-size: 1rem;
            line-height: 1.4;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes beat {
            0% { transform: scale(1); }
            20% { transform: scale(1.15); }
            40% { transform: scale(1); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Hiệu ứng pháo hoa giấy */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            z-index: 10;
            border-radius: 50%;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Chèn bài nhạc Happy Birthday (Sử dụng link audio trực tuyến ổn định công cộng) -->
    <audio id="birthday-music" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/123/123-84.wav" type="audio/wav">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ phát âm thanh.
    </audio>

    <div class="birthday-card" id="card" onclick="openCard()">
        <!-- Cụm nắp thiệp lật 3D -->
        <div class="cover">
            <!-- Mặt ngoài trước khi mở -->
            <div class="front">
                <h1>Gửi bạn lời mời<br>trân trọng nhất</h1>
                <div class="heart-icon">❤️</div>
                <div class="click-me">Chạm để mở thiệp</div>
            </div>
            <!-- Mặt trong của nắp khi lật ra -->
            <div class="back">
                <div class="back-pattern">🎂</div>
            </div>
        </div>

        <!-- Phần nội dung cố định ở đáy thiệp -->
        <div class="inside">
            <h2>THƯ MỜI SINH NHẬT</h2>
            
            <p class="poem">
                "Nắng Bách Khoa thiêu đốt thời trai trẻ,<br>
                Bạn có mặt đốt bánh cùng với tôi."
            </p>

            <div class="info">
                📅 <b>Thời gian:</b> 19h00 Thứ 4 ngày 10 tháng 6<br>
                📍 <b>Tại:</b> THPT Lê Quý Đôn - ĐĐ
            </div>
            
            <p class="closing">
                Hãy mặc một bộ đồ thật đẹp cùng với tâm trạng vui vẻ nhất ❤️
            </p>
        </div>
    </div>

    <script>
        function openCard() {
            const card = document.getElementById('card');
            const music = document.getElementById('birthday-music');
            
            card.classList.toggle('open');
            
            if (card.classList.contains('open')) {
                // Kích hoạt pháo hoa giấy vụn
                createConfetti();
                // Phát nhạc sinh nhật
                music.play().catch(error => {
                    console.log("Trình duyệt chặn phát tự động: " + error);
                });
            } else {
                // Tắt hoặc tạm dừng nhạc nếu đóng thiệp lại
                music.pause();
                music.currentTime = 0; 
            }
        }

        function createConfetti() {
            const colors = ['#f2d74e', '#ff4d6d', '#9b5de5', '#00bbf9', '#00f5d4', '#ff9f1c'];
            
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 0.4) + 's';
                
                const size = Math.random() * 8 + 6 + 'px';
                confetti.style.width = size;
                confetti.style.height = size;
                if(Math.random() > 0.5) confetti.style.borderRadius = '0'; 

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 4500);
            }
        }
    </script>
</body>
</html>
